# ~/.config/alacritty/alacritty.toml

[env]
TERM = "xterm-256color"

[window]
padding = { x = 10, y = 10 }
dynamic_padding = true
decorations = "buttonless"   # keep native traffic-light/close controls but no title bar clutter
                             # use "none" if aerospace manages all chrome and you want zero decoration
opacity = 0.92

[scrolling]
history = 5000
multiplier = 3

[font]
size = 13.0

[font.normal]
family = "JetBrainsMono Nerd Font Mono"
style = "Regular"

[font.bold]
family = "JetBrainsMono Nerd Font Mono"
style = "Bold"

[font.italic]
family = "JetBrainsMono Nerd Font Mono"
style = "Italic"

# --- Colors: Catppuccin Mocha ---
[colors.primary]
background = "#1e1e2e"
foreground = "#cdd6f4"

[colors.cursor]
text = "#1e1e2e"
cursor = "#f5e0dc"

[colors.normal]
black   = "#45475a"
red     = "#f38ba8"
green   = "#a6e3a1"
yellow  = "#f9e2af"
blue    = "#89b4fa"
magenta = "#f5c2e7"
cyan    = "#94e2d5"
white   = "#bac2de"

[colors.bright]
black   = "#585b70"
red     = "#f38ba8"
green   = "#a6e3a1"
yellow  = "#f9e2af"
blue    = "#89b4fa"
magenta = "#f5c2e7"
cyan    = "#94e2d5"
white   = "#a6adc8"

[cursor]
style = { shape = "Block", blinking = "Off" }
vi_mode_style = { shape = "Block", blinking = "Off" }

[mouse]
hide_when_typing = true

[terminal]
osc52 = "CopyPaste"   # lets remote (SSH) sessions write to your LOCAL clipboard via OSC52

[keyboard]
bindings = [
  { key = "K", mods = "Command", action = "ClearHistory" },
  { key = "F", mods = "Command", action = "SearchForward" },
  { key = "B", mods = "Command", action = "SearchBackward" },

  { key = "Equals", mods = "Command", action = "IncreaseFontSize" },
  { key = "Minus",  mods = "Command", action = "DecreaseFontSize" },
  { key = "Key0",   mods = "Command", action = "ResetFontSize" },
]

[general]
live_config_reload = true
import = []
