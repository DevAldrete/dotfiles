#
# Minimalist Helix config, tuned for focused, low-distraction writing/coding.
# Place at: ~/.config/helix/config.toml
#

theme = "rose_pine"

[editor]
rulers = []
scrolloff = 8
cursorline = true
line-number = "relative"
bufferline = "multiple"

# Skip whitespace clutter
[editor.whitespace]
render = "none"

# Turn off indent guides — one less set of lines competing for attention
[editor.indent-guides]
render = false
gutters = ["diagnostics", "line-numbers"]

# Soft wrap long lines instead of horizontal scrolling
[editor.soft-wrap]
enable = true

[editor.statusline]
left = ["mode", "file-name"]
center = []
right = ["file-type", "position"]
separator = "│"
mode.normal = "NORMAL"
mode.insert = "INSERT"
mode.select = "SELECT"

[editor.cursor-shape]
normal = "block"
insert = "bar"
select = "underline"

[editor.file-picker]
hidden = false

[editor.auto-save]
focus-lost = true

[editor.lsp]
display-messages = false
display-inlay-hints = false

[keys.normal]
"C-s" = ":w"
